repos:
  - repo: local
    hooks:
      - id: rumdl
        name: Fix markdown
        entry: rumdl check --fix --fail-on error
        language: system
        types: [markdown]
        files: ^content/blog/
      - id: download-covers
        name: Download book covers
        entry: uv run scripts/download-covers.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-image-gps
        name: Check images for GPS data
        entry: uv run scripts/check_image_gps.py
        language: system
        types: [image]
        exclude_types: [svg]
