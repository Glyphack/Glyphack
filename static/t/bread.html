<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bread Calculator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0.5rem 0;
      padding: 0 0.75rem;
      line-height: 1.3;
    }
    h1 { font-size: 1.1rem; margin: 0.25rem 0 0.5rem; }
    h2 { font-size: 0.8rem; margin: 0.6rem 0 0.2rem; opacity: 0.75; }
    label {
      display: grid;
      grid-template-columns: 1fr 6.5rem;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    input { width: 100%; padding: 0.2rem 0.3rem; box-sizing: border-box; font-size: 0.95rem; }
    input[readonly] { background: #f3f3f3; color: #333; }
    .grid { display: grid; gap: 0.25rem; }
    .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.25rem; }
    .tabs button {
      flex: 1;
      padding: 0.3rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #f3f3f3;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .tabs button.active { background: #333; color: #fff; border-color: #333; }
    .note { font-size: 0.75rem; opacity: 0.75; margin: 0.2rem 0 0; }
    .back { display: inline-block; margin-top: 0.75rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>🍞 Bread</h1>

  <div class="tabs">
    <button id="tab-yeast" class="active" onclick="showTab('yeast')">Yeast</button>
    <button id="tab-sourdough" onclick="showTab('sourdough')">Sourdough</button>
  </div>

  <section id="panel-yeast">
    <h2>Percentages</h2>
    <div class="grid">
      <label>Hydration (%):
        <input type="number" id="bc-hyd" value="75" oninput="bcRecalc('hyd')">
      </label>
      <label>Salt (%):
        <input type="number" id="bc-salt-pct" value="1.5" step="0.1" oninput="bcRecalc('saltPct')">
      </label>
      <label>Yeast (%):
        <input type="number" id="bc-yeast-pct" value="1.5" step="0.1" oninput="bcRecalc('yeastPct')">
      </label>
    </div>

    <h2>Weights</h2>
    <div class="grid">
      <label>Total dough (g):
        <input type="number" id="bc-dough" value="1000" oninput="bcRecalc('dough')">
      </label>
      <label>Flour (g):
        <input type="number" id="bc-flour" oninput="bcRecalc('flour')">
      </label>
      <label>Water (g):
        <input type="number" id="bc-water" oninput="bcRecalc('water')">
      </label>
      <label>Salt (g):
        <input type="number" id="bc-salt" step="0.1" oninput="bcRecalc('salt')">
      </label>
      <label>Yeast (g):
        <input type="number" id="bc-yeast" step="0.1" oninput="bcRecalc('yeast')">
      </label>
    </div>
  </section>

  <section id="panel-sourdough" hidden>
    <h2>Percentages</h2>
    <div class="grid">
      <label>Hydration (%):
        <input type="number" id="sd-hyd" value="75" oninput="sdRecalc('hyd')">
      </label>
      <label>Salt (%):
        <input type="number" id="sd-salt-pct" value="1.5" step="0.1" oninput="sdRecalc('saltPct')">
      </label>
      <label>Starter (%):
        <input type="number" id="sd-starter-pct" value="15" oninput="sdRecalc('starterPct')">
      </label>
    </div>
    <p class="note">Starter is a share of flour. 10% warm kitchen, 20% cold.</p>

    <h2>Weights</h2>
    <div class="grid">
      <label>Total dough (g):
        <input type="number" id="sd-dough" value="1000" oninput="sdRecalc('dough')">
      </label>
      <label>Flour (g):
        <input type="number" id="sd-flour" oninput="sdRecalc('flour')">
      </label>
      <label>Water (g):
        <input type="number" id="sd-water" oninput="sdRecalc('water')">
      </label>
      <label>Salt (g):
        <input type="number" id="sd-salt" step="0.1" oninput="sdRecalc('salt')">
      </label>
      <label>Fed starter (g):
        <input type="number" id="sd-starter" step="0.1" oninput="sdRecalc('starter')">
      </label>
    </div>

    <h2>Feed the starter 1:1:1</h2>
    <div class="grid">
      <label>Unfed starter (g):
        <input type="number" id="sd-feed-starter" readonly>
      </label>
      <label>Flour to add (g):
        <input type="number" id="sd-feed-flour" readonly>
      </label>
      <label>Water to add (g):
        <input type="number" id="sd-feed-water" readonly>
      </label>
      <label>Total fed starter (g):
        <input type="number" id="sd-feed-total" readonly>
      </label>
    </div>
    <p class="note">Mix when the starter has doubled and is bubbly.</p>
  </section>

  <a class="back" href="/t">← back to tools</a>

  <script>
    function showTab(name) {
      const tabs = ['yeast', 'sourdough'];
      for (const t of tabs) {
        document.getElementById('panel-' + t).hidden = t !== name;
        document.getElementById('tab-' + t).classList.toggle('active', t === name);
      }
    }

    const round = n => Math.round(n * 10) / 10;

    function bcRecalc(source) {
      const h = +document.getElementById('bc-hyd').value / 100;
      const s = +document.getElementById('bc-salt-pct').value / 100;
      const y = +document.getElementById('bc-yeast-pct').value / 100;
      const factor = 1 + h + s + y;

      let flour;
      if (source === 'flour') {
        flour = +document.getElementById('bc-flour').value;
      } else if (source === 'water') {
        flour = h ? +document.getElementById('bc-water').value / h : 0;
      } else if (source === 'salt') {
        flour = s ? +document.getElementById('bc-salt').value / s : 0;
      } else if (source === 'yeast') {
        flour = y ? +document.getElementById('bc-yeast').value / y : 0;
      } else {
        flour = +document.getElementById('bc-dough').value / factor;
      }

      const setIfNot = (id, val) => {
        if (source !== id) document.getElementById('bc-' + id).value = round(val);
      };

      setIfNot('flour', flour);
      setIfNot('water', flour * h);
      setIfNot('salt', flour * s);
      setIfNot('yeast', flour * y);
      setIfNot('dough', flour * factor);
    }

    function sdRecalc(source) {
      const h = +document.getElementById('sd-hyd').value / 100;
      const s = +document.getElementById('sd-salt-pct').value / 100;
      const st = +document.getElementById('sd-starter-pct').value / 100;
      const factor = 1 + h + s + st;

      let flour;
      if (source === 'flour') {
        flour = +document.getElementById('sd-flour').value;
      } else if (source === 'water') {
        flour = h ? +document.getElementById('sd-water').value / h : 0;
      } else if (source === 'salt') {
        flour = s ? +document.getElementById('sd-salt').value / s : 0;
      } else if (source === 'starter') {
        flour = st ? +document.getElementById('sd-starter').value / st : 0;
      } else {
        flour = +document.getElementById('sd-dough').value / factor;
      }

      const setIfNot = (id, val) => {
        if (source !== id) document.getElementById('sd-' + id).value = round(val);
      };

      const starter = flour * st;
      setIfNot('flour', flour);
      setIfNot('water', flour * h);
      setIfNot('salt', flour * s);
      setIfNot('starter', starter);
      setIfNot('dough', flour * factor);

      const part = starter / 3;
      document.getElementById('sd-feed-starter').value = round(part);
      document.getElementById('sd-feed-flour').value = round(part);
      document.getElementById('sd-feed-water').value = round(part);
      document.getElementById('sd-feed-total').value = round(starter);
    }

    bcRecalc('dough');
    sdRecalc('dough');
  </script>
</body>
</html>
