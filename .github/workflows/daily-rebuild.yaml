name: daily rebuild
on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight UTC.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Cloudflare build
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
